<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Talaba yutuqlari</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      color: #202124;
      background: #f6f7f9;
      font-family: Arial, sans-serif;
    }
    main { width: min(100%, 480px); margin: 0 auto; }
    h1 { margin: 0 0 22px; font-size: 23px; }
    form, .saved-item {
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #fff;
    }
    form { margin-bottom: 12px; }
    label { display: block; margin: 0 0 8px; font-size: 14px; font-weight: 600; }
    input[type="file"], input[type="url"], input[type="text"],
    input[type="tel"], input[type="password"] {
      display: block;
      width: 100%;
      min-height: 44px;
      padding: 10px;
      border: 1px solid #d6d9df;
      border-radius: 8px;
      background: #fff;
      color: #202124;
      font: inherit;
    }
    input[type="file"] { padding: 8px; }
    .registration-section { margin-bottom: 12px; }
    .registration-section label { margin-top: 14px; }
    .upload-button {
      width: 100%;
      min-height: 44px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: #2878e5;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .upload-button:disabled { opacity: .6; cursor: wait; }
    .saved-list { display: grid; gap: 10px; margin: -2px 0 16px; }
    .saved-item { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; }
    .saved-item img { width: 76px; height: 76px; border-radius: 7px; object-fit: cover; }
    .saved-item a { overflow-wrap: anywhere; color: #1769d2; font-size: 14px; }
    #app-view { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
    .profile-card {
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #fff;
    }
    .profile-card h2 { margin: 0 0 14px; font-size: 18px; }
    .profile-details { margin: 0; }
    .profile-details > div {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-top: 1px solid #eef0f3;
    }
    .profile-details dt { color: #626a73; }
    .profile-details dd { margin: 0; font-weight: 600; text-align: right; overflow-wrap: anywhere; }
    .bottom-nav {
      position: fixed;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 8px max(16px, calc((100% - 480px) / 2 + 16px)) calc(8px + env(safe-area-inset-bottom));
      border-top: 1px solid #e5e7eb;
      background: #fff;
    }
    .bottom-nav button {
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      color: #626a73;
      background: transparent;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .bottom-nav button[aria-current="page"] { color: #1769d2; background: #eaf2ff; }
    .remove-button {
      display: block;
      width: auto;
      min-height: 0;
      margin-top: 9px;
      padding: 0;
      border: 0;
      color: #777;
      background: none;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    @media (max-width: 360px) {
      body { padding: 18px 12px; }
      form, .saved-item { padding: 13px; }
    }
  </style>
</head>
<body>
  <main>
    <h1 id="page-title">Ro‘yxatdan o‘tish</h1>

    <section class="registration-section" id="registration-view" hidden>
      <form id="registration-form">
        <label for="first-name">Ism</label>
        <input id="first-name" name="firstName" type="text" autocomplete="given-name" maxlength="80" required>

        <label for="last-name">Familiya</label>
        <input id="last-name" name="lastName" type="text" autocomplete="family-name" maxlength="80" required>

        <label for="student-group">Guruhi</label>
        <input id="student-group" name="group" type="text" maxlength="80" required>

        <label for="phone">Telefon raqami</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="24" placeholder="+998 90 123 45 67" required>

        <label for="access-code">Maxfiy kod</label>
        <input id="access-code" name="accessCode" type="password" autocomplete="new-password" maxlength="100" required>

        <button class="upload-button" type="submit">Ro‘yxatdan o‘tish</button>
      </form>
    </section>

    <div id="app-view" hidden>
      <section id="home-view">
        <form id="photo-form">
          <label for="photo">Yutuq rasmi</label>
          <input id="photo" type="file" accept="image/*" required>
          <button class="upload-button" type="submit">Rasmni yuklash</button>
        </form>
        <section class="saved-list" id="photo-list" aria-label="Saqlangan rasmlar"></section>

        <form id="video-form">
          <label for="instagram">Instagram video havolasi</label>
          <input id="instagram" type="url" placeholder="https://www.instagram.com/..." required>
          <button class="upload-button" type="submit">Havolani yuklash</button>
        </form>
        <section class="saved-list" id="video-list" aria-label="Saqlangan havolalar"></section>
      </section>

      <section id="profile-view" hidden>
        <div class="profile-card">
          <h2>Ro‘yxatdan o‘tgan ma’lumotlar</h2>
          <dl class="profile-details">
            <div><dt>Ism</dt><dd id="profile-first-name">—</dd></div>
            <div><dt>Familiya</dt><dd id="profile-last-name">—</dd></div>
            <div><dt>Guruhi</dt><dd id="profile-group">—</dd></div>
            <div><dt>Telefon raqami</dt><dd id="profile-phone">—</dd></div>
          </dl>
        </div>
      </section>

      <nav class="bottom-nav" aria-label="Pastki navigatsiya">
        <button id="home-tab" type="button" aria-current="page">Asosiy</button>
        <button id="profile-tab" type="button">Profil</button>
      </nav>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, onValue, ref, remove, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    (() => {
      const firebaseConfig = {
        apiKey: "AIzaSyASXLNGJaWRbmL2VUeTTub3qxQqfttQcR",
        authDomain: "grand-academy-a7286.firebaseapp.com",
        databaseURL: "https://grand-academy-a7286-default-rtdb.firebaseio.com/",
        projectId: "grand-academy-a7286",
        storageBucket: "grand-academy-a7286.firebasestorage.app",
        messagingSenderId: "403319946045",
        appId: "1:403319946045:web:e29dde92968c6a88fda354",
        measurementId: "G-B6F4RDYMN9"
      };
      const photoStore = "rasmlar";
      const videoStore = "video-havolalar";
      const photoForm = document.getElementById("photo-form");
      const videoForm = document.getElementById("video-form");
      const registrationView = document.getElementById("registration-view");
      const registrationForm = document.getElementById("registration-form");
      const appView = document.getElementById("app-view");
      const pageTitle = document.getElementById("page-title");
      const homeView = document.getElementById("home-view");
      const profileView = document.getElementById("profile-view");
      const homeTab = document.getElementById("home-tab");
      const profileTab = document.getElementById("profile-tab");
      const photoInput = document.getElementById("photo");
      const instagramInput = document.getElementById("instagram");
      const accessCodeInput = document.getElementById("access-code");
      const photoList = document.getElementById("photo-list");
      const videoList = document.getElementById("video-list");
      const accessCodeHash = "2f7aab7a4ca5a9af404c22f6a3f6d95f4f26414d39b8aa74bbb19357859113d2";
      let activeSection = "home";

      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }

      if (firebaseConfig.apiKey === "YOUR_FIREBASE_API_KEY") {
        window.alert("Firebase apiKey qiymatini firebaseConfig ichiga kiriting");
        return;
      }

      const telegramUserId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
      if (!telegramUserId) {
        window.alert("Ilovani Telegram orqali oching");
        return;
      }

      const database = getDatabase(initializeApp(firebaseConfig));
      const userPath = `users/${telegramUserId}`;
      let userData = {};

      function createId() {
        return typeof crypto.randomUUID === "function"
          ? crypto.randomUUID()
          : String(Date.now()) + "-" + Math.random().toString(36).slice(2);
      }

      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(file);
        });
      }

      function saveItem(storeName, item) {
        return set(ref(database, `${userPath}/${storeName}/${item.id}`), item);
      }

      function deleteItem(storeName, id) {
        return remove(ref(database, `${userPath}/${storeName}/${id}`));
      }

      function showSection(section) {
        activeSection = section;
        const isHome = section === "home";
        homeView.hidden = !isHome;
        profileView.hidden = isHome;
        pageTitle.textContent = isHome ? "Talaba yutuqlari" : "Profil";
        if (isHome) {
          homeTab.setAttribute("aria-current", "page");
          profileTab.removeAttribute("aria-current");
        } else {
          profileTab.setAttribute("aria-current", "page");
          homeTab.removeAttribute("aria-current");
        }
      }

      function renderProfile() {
        const profile = userData.profile || {};
        document.getElementById("profile-first-name").textContent = profile.firstName || "—";
        document.getElementById("profile-last-name").textContent = profile.lastName || "—";
        document.getElementById("profile-group").textContent = profile.group || "—";
        document.getElementById("profile-phone").textContent = profile.phone || "—";
      }

      homeTab.addEventListener("click", () => showSection("home"));
      profileTab.addEventListener("click", () => {
        renderProfile();
        showSection("profile");
      });

      async function isAccessCodeValid(value) {
        const bytes = new TextEncoder().encode(value.trim());
        const digest = await crypto.subtle.digest("SHA-256", bytes);
        const hash = Array.from(new Uint8Array(digest), (byte) =>
          byte.toString(16).padStart(2, "0")
        ).join("");
        return hash === accessCodeHash;
      }

      registrationForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!registrationForm.reportValidity()) return;
        accessCodeInput.setCustomValidity("");

        const button = registrationForm.querySelector("button");
        button.disabled = true;
        try {
          if (!crypto.subtle) throw new Error("Secure code verification is unavailable");
          const validCode = await isAccessCodeValid(accessCodeInput.value);
          if (!validCode) {
            accessCodeInput.setCustomValidity("Maxfiy kod noto‘g‘ri");
            accessCodeInput.reportValidity();
            return;
          }

          await set(ref(database, `${userPath}/profile`), {
            firstName: document.getElementById("first-name").value.trim(),
            lastName: document.getElementById("last-name").value.trim(),
            group: document.getElementById("student-group").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            registeredAt: Date.now()
          });
          registrationForm.reset();
        } catch {
          window.alert("Ro‘yxatdan o‘tib bo‘lmadi. Internet aloqasi va Firebase qoidalarini tekshiring");
        } finally {
          button.disabled = false;
        }
      });

      accessCodeInput.addEventListener("input", () => accessCodeInput.setCustomValidity(""));

      function addRemoveButton(storeName, item, parent) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "remove-button";
        button.textContent = "O‘chirish";
        button.addEventListener("click", async () => {
          try {
            await deleteItem(storeName, item.id);
          } catch {
            window.alert("Ma’lumotni o‘chirib bo‘lmadi");
          }
        });
        parent.append(button);
      }

      function renderItems() {
        photoList.replaceChildren();
        videoList.replaceChildren();

        const photos = Object.values(userData[photoStore] || {});
        const videos = Object.values(userData[videoStore] || {});
        photos.sort((a, b) => b.createdAt - a.createdAt);
        videos.sort((a, b) => b.createdAt - a.createdAt);

        for (const item of photos) {
          const card = document.createElement("article");
          card.className = "saved-item";
          const image = document.createElement("img");
          image.alt = "Yutuq rasmi";
          image.src = item.photo;
          const details = document.createElement("div");
          addRemoveButton(photoStore, item, details);
          card.append(image, details);
          photoList.append(card);
        }

        for (const item of videos) {
          const card = document.createElement("article");
          card.className = "saved-item";
          const details = document.createElement("div");
          details.style.gridColumn = "1 / -1";
          const link = document.createElement("a");
          link.href = item.instagram;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Instagram videosi";
          details.append(link);
          addRemoveButton(videoStore, item, details);
          card.append(details);
          videoList.append(card);
        }
      }

      photoForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!photoForm.reportValidity()) return;
        const photo = photoInput.files[0];
        if (!photo || !photo.type.startsWith("image/")) return;

        const button = photoForm.querySelector("button");
        button.disabled = true;
        try {
          await saveItem(photoStore, {
            id: createId(),
            photo: await fileToBase64(photo),
            createdAt: Date.now()
          });
          photoForm.reset();
        } catch {
          window.alert("Rasmni Firebase bazasiga saqlab bo‘lmadi");
        } finally {
          button.disabled = false;
        }
      });

      videoForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!videoForm.reportValidity()) return;

        let instagram;
        try {
          instagram = new URL(instagramInput.value.trim());
        } catch {
          instagramInput.setCustomValidity("Instagram havolasini kiriting");
          instagramInput.reportValidity();
          return;
        }
        instagramInput.setCustomValidity("");
        if (instagram.protocol !== "https:" ||
            !(instagram.hostname === "instagram.com" || instagram.hostname.endsWith(".instagram.com"))) {
          instagramInput.setCustomValidity("Instagram havolasini kiriting");
          instagramInput.reportValidity();
          return;
        }

        const button = videoForm.querySelector("button");
        button.disabled = true;
        try {
          await saveItem(videoStore, {
            id: createId(),
            instagram: instagram.href,
            createdAt: Date.now()
          });
          videoForm.reset();
        } catch {
          window.alert("Havolani Firebase bazasiga saqlab bo‘lmadi");
        } finally {
          button.disabled = false;
        }
      });

      instagramInput.addEventListener("input", () => instagramInput.setCustomValidity(""));

      onValue(
        ref(database, userPath),
        (snapshot) => {
          userData = snapshot.val() || {};
          const profile = userData.profile;
          const isRegistered = Boolean(
            profile && profile.firstName && profile.lastName && profile.group && profile.phone
          );
          registrationView.hidden = isRegistered;
          appView.hidden = !isRegistered;
          pageTitle.textContent = isRegistered
            ? (activeSection === "home" ? "Talaba yutuqlari" : "Profil")
            : "Ro‘yxatdan o‘tish";
          if (isRegistered) renderProfile();
          renderItems();
        },
        () => window.alert("Firebase bazasiga ulanib bo‘lmadi. URL va qoidalarni tekshiring")
      );
    })();
  </script>
</body>
</html>
