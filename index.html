<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Talaba yutuqlari</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      color: #202124;
      background: #f6f7f9;
      font-family: Arial, sans-serif;
    }
    main { width: min(100%, 480px); margin: 0 auto; }
    h1 { margin: 0 0 22px; font-size: 23px; }
    form, .saved-item {
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      background: #fff;
    }
    form { margin-bottom: 12px; }
    label { display: block; margin: 0 0 8px; font-size: 14px; font-weight: 600; }
    input[type="file"], input[type="url"] {
      display: block;
      width: 100%;
      min-height: 44px;
      padding: 10px;
      border: 1px solid #d6d9df;
      border-radius: 8px;
      background: #fff;
      color: #202124;
      font: inherit;
    }
    input[type="file"] { padding: 8px; }
    .upload-button {
      width: 100%;
      min-height: 44px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: #2878e5;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .upload-button:disabled { opacity: .6; cursor: wait; }
    .saved-list { display: grid; gap: 10px; margin: -2px 0 16px; }
    .saved-item { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; }
    .saved-item img { width: 76px; height: 76px; border-radius: 7px; object-fit: cover; }
    .saved-item a { overflow-wrap: anywhere; color: #1769d2; font-size: 14px; }
    .remove-button {
      display: block;
      width: auto;
      min-height: 0;
      margin-top: 9px;
      padding: 0;
      border: 0;
      color: #777;
      background: none;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    @media (max-width: 360px) {
      body { padding: 18px 12px; }
      form, .saved-item { padding: 13px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Talaba yutuqlari</h1>

    <form id="photo-form">
      <label for="photo">Yutuq rasmi</label>
      <input id="photo" type="file" accept="image/*" required>
      <button class="upload-button" type="submit">Rasmni yuklash</button>
    </form>
    <section class="saved-list" id="photo-list" aria-label="Saqlangan rasmlar"></section>

    <form id="video-form">
      <label for="instagram">Instagram video havolasi</label>
      <input id="instagram" type="url" placeholder="https://www.instagram.com/..." required>
      <button class="upload-button" type="submit">Havolani yuklash</button>
    </form>
    <section class="saved-list" id="video-list" aria-label="Saqlangan havolalar"></section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, onValue, ref, remove, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    (() => {
      const firebaseConfig = {
        apiKey:"AIzaSyASXLNGJaWRbmL2VUeTTub3qxQqfttQcRY",",
        authDomain: "grand-academy-a7286.firebaseapp.com",
        databaseURL: "https://grand-academy-a7286-default-rtdb.firebaseio.com/",
        projectId: "grand-academy-a7286",
        storageBucket: "grand-academy-a7286.firebasestorage.app",
        messagingSenderId: "403319946045",
        appId: "1:403319946045:web:e29dde92968c6a88fda354",
        measurementId: "G-B6F4RDYMN9"
      };
      const photoStore = "rasmlar";
      const videoStore = "video-havolalar";
      const photoForm = document.getElementById("photo-form");
      const videoForm = document.getElementById("video-form");
      const photoInput = document.getElementById("photo");
      const instagramInput = document.getElementById("instagram");
      const photoList = document.getElementById("photo-list");
      const videoList = document.getElementById("video-list");

      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }

      if (firebaseConfig.apiKey === "YOUR_FIREBASE_API_KEY") {
        window.alert("Firebase apiKey qiymatini firebaseConfig ichiga kiriting");
        return;
      }

      const telegramUserId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
      if (!telegramUserId) {
        window.alert("Ilovani Telegram orqali oching");
        return;
      }

      const database = getDatabase(initializeApp(firebaseConfig));
      const userPath = `users/${telegramUserId}`;
      let userData = {};

      function createId() {
        return typeof crypto.randomUUID === "function"
          ? crypto.randomUUID()
          : String(Date.now()) + "-" + Math.random().toString(36).slice(2);
      }

      function fileToBase64(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(file);
        });
      }

      function saveItem(storeName, item) {
        return set(ref(database, `${userPath}/${storeName}/${item.id}`), item);
      }

      function deleteItem(storeName, id) {
        return remove(ref(database, `${userPath}/${storeName}/${id}`));
      }

      function addRemoveButton(storeName, item, parent) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "remove-button";
        button.textContent = "O‘chirish";
        button.addEventListener("click", async () => {
          try {
            await deleteItem(storeName, item.id);
          } catch {
            window.alert("Ma’lumotni o‘chirib bo‘lmadi");
          }
        });
        parent.append(button);
      }

      function renderItems() {
        photoList.replaceChildren();
        videoList.replaceChildren();

        const photos = Object.values(userData[photoStore] || {});
        const videos = Object.values(userData[videoStore] || {});
        photos.sort((a, b) => b.createdAt - a.createdAt);
        videos.sort((a, b) => b.createdAt - a.createdAt);

        for (const item of photos) {
          const card = document.createElement("article");
          card.className = "saved-item";
          const image = document.createElement("img");
          image.alt = "Yutuq rasmi";
          image.src = item.photo;
          const details = document.createElement("div");
          addRemoveButton(photoStore, item, details);
          card.append(image, details);
          photoList.append(card);
        }

        for (const item of videos) {
          const card = document.createElement("article");
          card.className = "saved-item";
          const details = document.createElement("div");
          details.style.gridColumn = "1 / -1";
          const link = document.createElement("a");
          link.href = item.instagram;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Instagram videosi";
          details.append(link);
          addRemoveButton(videoStore, item, details);
          card.append(details);
          videoList.append(card);
        }
      }

      photoForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!photoForm.reportValidity()) return;
        const photo = photoInput.files[0];
        if (!photo || !photo.type.startsWith("image/")) return;

        const button = photoForm.querySelector("button");
        button.disabled = true;
        try {
          await saveItem(photoStore, {
            id: createId(),
            photo: await fileToBase64(photo),
            createdAt: Date.now()
          });
          photoForm.reset();
        } catch {
          window.alert("Rasmni Firebase bazasiga saqlab bo‘lmadi");
        } finally {
          button.disabled = false;
        }
      });

      videoForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!videoForm.reportValidity()) return;

        let instagram;
        try {
          instagram = new URL(instagramInput.value.trim());
        } catch {
          instagramInput.setCustomValidity("Instagram havolasini kiriting");
          instagramInput.reportValidity();
          return;
        }
        instagramInput.setCustomValidity("");
        if (instagram.protocol !== "https:" ||
            !(instagram.hostname === "instagram.com" || instagram.hostname.endsWith(".instagram.com"))) {
          instagramInput.setCustomValidity("Instagram havolasini kiriting");
          instagramInput.reportValidity();
          return;
        }

        const button = videoForm.querySelector("button");
        button.disabled = true;
        try {
          await saveItem(videoStore, {
            id: createId(),
            instagram: instagram.href,
            createdAt: Date.now()
          });
          videoForm.reset();
        } catch {
          window.alert("Havolani Firebase bazasiga saqlab bo‘lmadi");
        } finally {
          button.disabled = false;
        }
      });

      instagramInput.addEventListener("input", () => instagramInput.setCustomValidity(""));

      onValue(
        ref(database, userPath),
        (snapshot) => {
          userData = snapshot.val() || {};
          renderItems();
        },
        () => window.alert("Firebase bazasiga ulanib bo‘lmadi. URL va qoidalarni tekshiring")
      );
    })();
  </script>
</body>
</html>
